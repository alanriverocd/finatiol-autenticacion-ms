spring.application.name=finatiol-autenticacion-ms

spring.config.import=optional:configserver:http://config-ms:8888

server.port=8081

eureka.client.enabled=true

eureka.client.service-url.defaultZone=http://discovery-ms:8761/eureka/

spring.datasource.url=jdbc:postgresql://postgres:5432/BDFINATIOL

spring.datasource.username=postgres

spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true

# Distributed Tracing - Zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://finatiol-zipkin:9411/api/v2/spans